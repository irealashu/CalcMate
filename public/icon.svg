<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Background body -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Screen mockup -->
  <rect x="80" y="80" width="352" height="110" rx="20" fill="#0c1928" stroke="#1e3a5f" stroke-width="3" />
  <rect x="92" y="92" width="328" height="86" rx="14" fill="#042f2e" opacity="0.6" />
  <text x="110" y="128" fill="#5eead4" font-family="monospace" font-size="22" font-weight="600">∫ e^(-x²) dx = √π/2</text>
  <text x="390" y="162" fill="#2dd4bf" font-family="monospace" font-size="28" font-weight="700" text-anchor="end">3.14159265</text>
  
  <!-- Keys grid -->
  <!-- Row 1: Function keys -->
  <rect x="80" y="210" width="68" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="114" y="238" fill="#94a3b8" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">sin</text>
  
  <rect x="160" y="210" width="68" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="194" y="238" fill="#94a3b8" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">cos</text>

  <rect x="240" y="210" width="68" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="274" y="238" fill="#94a3b8" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">tan</text>

  <rect x="320" y="210" width="112" height="44" rx="10" fill="#dc2626" />
  <text x="376" y="238" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">DEL</text>

  <!-- Row 2: Secondary Functions -->
  <rect x="80" y="270" width="68" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="114" y="298" fill="#94a3b8" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">ln</text>

  <rect x="160" y="270" width="68" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="194" y="298" fill="#94a3b8" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">x²</text>

  <rect x="240" y="270" width="68" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="274" y="298" fill="#94a3b8" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">√x</text>

  <rect x="320" y="270" width="112" height="44" rx="10" fill="#b91c1c" />
  <text x="376" y="298" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">AC</text>

  <!-- Row 3 & 4: Numerical & Operators -->
  <rect x="80" y="330" width="68" height="50" rx="12" fill="#334155" />
  <text x="114" y="362" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">7</text>

  <rect x="160" y="330" width="68" height="50" rx="12" fill="#334155" />
  <text x="194" y="362" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">8</text>

  <rect x="240" y="330" width="68" height="50" rx="12" fill="#334155" />
  <text x="274" y="362" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">9</text>

  <rect x="320" y="330" width="112" height="50" rx="12" fill="url(#amberGrad)" />
  <text x="376" y="363" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="700" text-anchor="middle">×</text>

  <!-- Row 5: Equals & Operations -->
  <rect x="80" y="396" width="68" height="50" rx="12" fill="#334155" />
  <text x="114" y="428" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">0</text>

  <rect x="160" y="396" width="68" height="50" rx="12" fill="#334155" />
  <text x="194" y="428" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">.</text>

  <rect x="240" y="396" width="68" height="50" rx="12" fill="#334155" />
  <text x="274" y="428" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle">Ans</text>

  <rect x="320" y="396" width="112" height="50" rx="12" fill="url(#accentGrad)" />
  <text x="376" y="428" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="700" text-anchor="middle">=</text>
</svg>
